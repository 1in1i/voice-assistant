<!DOCTYPE html>
<html>
<head>
    <title>AI Voice Assistant</title>
    <style>
        #status { color: #666; margin: 10px 0; font-style: italic; }
    </style>
</head>
<body>
    <h1>AI Assistant</h1>
    <button id="startBtn">Start</button>
    <button id="stopBtn" disabled>Stop</button>
    <p><strong>You:</strong> <span id="userTxt"></span></p>
    <p><strong>AI:</strong> <span id="agentTxt"></span></p>
    <div id="status">Ready</div>

    <script src="https://cdn.jsdelivr.net/npm/hark@1.2.3/hark.bundle.js"></script>

    <script>
        let mediaRecorder;
        let audioChunks = [];
        let speechEvents = null;
        let stream = null;
        let isProcessing = false;

        const startBtn = document.getElementById('startBtn');
        const stopBtn = document.getElementById('stopBtn');
        const status = document.getElementById('status');
        const userTxt = document.getElementById('userTxt');
        const agentTxt = document.getElementById('agentTxt');

        async function initHark() {
            stream = await navigator.mediaDevices.getUserMedia({ audio: true });
            speechEvents = hark(stream, {
                threshold: -50,
                interval: 100
            });

            mediaRecorder = new MediaRecorder(stream);

            mediaRecorder.ondataavailable = (event) => {
                audioChunks.push(event.data);
            };

            mediaRecorder.onstop = async () => {
                const audioBlob = new Blob(audioChunks, { type: 'audio/wav' });
                audioChunks = [];
                if (!isProcessing) {
                    await sendToServer(audioBlob);
                }
            };

            speechEvents.on('speaking', () => {
                if (isProcessing) return;

                console.log("Speaking detected");
                status.innerText = "Listening...";

                if (window.currentAudio) window.currentAudio.pause();

                if (mediaRecorder.state === "inactive") {
                    audioChunks = [];
                    mediaRecorder.start();
                }
            });

            speechEvents.on('stopped_speaking', () => {
                if (mediaRecorder.state === "recording") {
                    console.log("Stop speaking detected");
                    mediaRecorder.stop();
                    status.innerText = "Thinking...";
                }
            });
        }

        startBtn.onclick = async () => {
            try {
                if (!speechEvents) {
                    await initHark();
                }
                isProcessing = false;
                startBtn.disabled = true;
                stopBtn.disabled = false;
                status.innerText = "Waiting for your voice...";
            } catch (err) {
                console.error("Initialization failed:", err);
                status.innerText = "Error: Mic access denied";
            }
        };

        stopBtn.onclick = () => {
            isProcessing = true;
            if (mediaRecorder && mediaRecorder.state !== "inactive") {
                mediaRecorder.stop();
            }
            startBtn.disabled = false;
            stopBtn.disabled = true;
            status.innerText = "Stopped";
        };

        async function sendToServer(blob) {
            isProcessing = true;
            const formData = new FormData();
            formData.append('file', blob, "input.wav");

            try {
                const response = await fetch('/chat', { method: 'POST', body: formData });
                const data = await response.json();

                userTxt.innerText = data.user_text;
                agentTxt.innerText = data.response;

                status.innerText = "AI Speaking...";

                const audioUrl = data.audio_response_path + "?t=" + new Date().getTime();
                const audio = new Audio(audioUrl);
                window.currentAudio = audio;

                audio.onended = () => {
                    isProcessing = false;
                    if (!stopBtn.disabled) {
                        status.innerText = "Waiting for your question...";
                    }
                };
                audio.play();

            } catch (err) {
                console.error("Server error:", err);
                status.innerText = "Network Error";
                isProcessing = false;
            }
        }
    </script>
</body>
</html>
